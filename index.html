<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="data:image/svg+xml,<svg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'><text%20y='.9em'%20font-size='90'>🧠</text></svg>" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Memory Meltdown</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { height:100%; }
  body { font-family:"Arial Black",system-ui,sans-serif; color:#fff; background:radial-gradient(circle at 50% 18%,#1c1140,#070510);
    min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:18px; touch-action:manipulation; }
  h1 { font-size:28px; text-shadow:0 0 16px #16f2c8; }
  .status { font-size:16px; color:#c8b8ff; margin:8px 0 14px; min-height:22px; text-align:center; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:min(86vw,340px); height:min(86vw,340px); }
  .pad { border-radius:18px; opacity:.45; transition:opacity .06s, transform .06s; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:36px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.7)); }
  @keyframes lvlbounce { 0%{transform:scale(1)} 35%{transform:scale(1.35)} 65%{transform:scale(.92)} 100%{transform:scale(1)} }
  .lvlbadge { font-size:52px; font-weight:900; min-height:0; text-align:center; color:#16f2c8; text-shadow:0 0 24px #16f2c8; transition:all .2s; }
  .lvlbadge.bump { animation:lvlbounce .38s ease-out; }
  .pad.lit { opacity:1; transform:scale(1.04); box-shadow:0 0 30px currentColor; }
  .p0{ background:#16f2c8; color:#16f2c8 } .p1{ background:#ff3df0; color:#ff3df0 }
  .p2{ background:#ffe15d; color:#ffe15d } .p3{ background:#7b5cff; color:#7b5cff }
  button { font-family:inherit; font-weight:900; font-size:18px; padding:14px 26px; border:none; border-radius:14px;
    color:#070510; background:linear-gradient(90deg,#16f2c8,#ff3df0); cursor:pointer; margin-top:16px; }
  .ghost { background:transparent; color:#16f2c8; border:2px solid #16f2c8; }
  .hidden { display:none; }
  .challenge { font-size:13px; color:#16f2c8; font-weight:900; letter-spacing:.5px; margin-top:8px; min-height:16px; text-align:center; }
</style>
</head>
<body>
  <h1>🧠 Memory Meltdown</h1>
  <div id="lvl" class="lvlbadge"></div>
  <div class="status" id="status">Watch the pattern, then tap it back.</div>
  <div class="grid" id="grid">
    <div class="pad p0" data-i="0">💎</div><div class="pad p1" data-i="1">🌸</div>
    <div class="pad p2" data-i="2">⚡</div><div class="pad p3" data-i="3">💜</div>
  </div>
  <button id="start">▶ START</button>
  <button id="share" class="ghost hidden" aria-label="Share your score">📲 Share</button>
  <div class="challenge" id="ch"></div>
<script>
(() => {
  const status=document.getElementById('status'), startBtn=document.getElementById('start'),
        shareBtn=document.getElementById('share'), chEl=document.getElementById('ch'), lvlEl=document.getElementById('lvl');
  const pads=[...document.querySelectorAll('.pad')];
  const FREQ=[330,392,494,659];
  let sequence=[], inputIndex=0, level=0, phase='idle', best=+(localStorage.memBest||0), actx=null;
  // --- shareable result card + challenge deep-link ---
  const _qs=new URLSearchParams(location.search);
  function _gameURL(p){ return location.origin+location.pathname+(p?('?'+p):''); }
  const _rawT=_qs.get('target'); const _chT=(_rawT&&/^\d+$/.test(_rawT))?+_rawT:0;
  async function shareCard(title,bigTxt,sub2,text){
    try{
      const c=document.createElement('canvas'); c.width=c.height=1080; const x=c.getContext('2d');
      const g=x.createLinearGradient(0,0,1080,1080); g.addColorStop(0,'#1a0f3d'); g.addColorStop(1,'#070510'); x.fillStyle=g; x.fillRect(0,0,1080,1080);
      x.fillStyle='rgba(22,242,200,.10)'; x.beginPath(); x.arc(540,430,380,0,7); x.fill(); x.textAlign='center';
      x.fillStyle='#fff'; x.font='bold 66px Arial'; x.fillText(title,540,250);
      x.fillStyle='#16f2c8'; x.font='bold 200px Arial'; x.fillText(bigTxt,540,610);
      x.fillStyle='#ff3df0'; x.font='bold 54px Arial'; x.fillText(sub2,540,740);
      x.fillStyle='#c9b8ff'; x.font='bold 44px Arial'; x.fillText('VIBE ARCADE',540,960);
      x.fillStyle='#8a7fb0'; x.font='30px Arial'; x.fillText('64johnlee.github.io/vibe-arcade',540,1012);
      const blob=await new Promise(r=>c.toBlob(r,'image/png'));
      if(!blob) throw new Error('canvas export failed');
      const file=new File([blob],'vibe-arcade.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],text}); return; }
      const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download='vibe-arcade.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(u),3000);
      try{ await navigator.clipboard.writeText(text); }catch(_){}
    }catch(_){ try{ await navigator.clipboard.writeText(text); }catch(__){} }
  }
  if(_chT) chEl.textContent='🎯 BEAT LEVEL '+_chT;
  function setPhase(p){ phase=p; }
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  function tone(i){
    if(!actx) return;
    const o=actx.createOscillator(), g=actx.createGain();
    o.frequency.value=FREQ[i]; o.type='sine'; g.gain.value=.12;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+.3);
  }
  async function light(i,ms){ pads[i].classList.add('lit'); tone(i); await wait(ms); pads[i].classList.remove('lit'); await wait(120); }
  async function playback(){
    setPhase('playback'); status.textContent='Watch…';
    const speed=Math.max(220,420-level*16);
    await wait(500);
    for(const i of sequence){ await light(i,speed); }
    inputIndex=0; setPhase('input'); status.textContent='Your turn! '+(sequence.length)+' to go';
  }
  function nextRound(){ sequence.push(Math.floor(Math.random()*4)); level=sequence.length; lvlEl.textContent='LVL '+level; lvlEl.classList.remove('bump'); void lvlEl.offsetWidth; lvlEl.classList.add('bump'); playback(); }
  function gameOver(){
    setPhase('over');
    const reached=level-1; const isBest=reached>best; if(isBest){ best=reached; localStorage.memBest=best; }
    lvlEl.textContent='';
    status.textContent=`💥 Meltdown! You reached level ${reached}. ${isBest?'🏆 NEW BEST':'Best '+best}`;
    if(_chT) chEl.textContent = reached>=_chT ? '🎯 CHALLENGE BEATEN! 🏆' : '🎯 Needed level '+_chT+' — missed by '+(_chT-reached);
    startBtn.textContent='▶ PLAY AGAIN'; startBtn.classList.remove('hidden'); shareBtn.classList.remove('hidden');
    shareBtn.dataset.lvl=reached;
  }
  async function onPad(i){
    if(phase!=='input') return;
    await light(i,160);
    if(i===sequence[inputIndex]){
      inputIndex++;
      if(inputIndex===sequence.length){ setPhase('wait'); status.textContent='Nice! ✅'; await wait(500); nextRound(); }
      else status.textContent='Your turn! '+(sequence.length-inputIndex)+' to go';
    } else gameOver();
  }
  pads.forEach((p,i)=>p.addEventListener('pointerdown',()=>onPad(i)));
  startBtn.onclick=()=>{
    if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(actx&&actx.state==='suspended') actx.resume();
    sequence=[]; level=0; lvlEl.textContent=''; startBtn.classList.add('hidden'); shareBtn.classList.add('hidden');
    if(_chT) chEl.textContent='🎯 BEAT LEVEL '+_chT;
    nextRound();
  };
  shareBtn.onclick=()=>{ const lvl=shareBtn.dataset.lvl; shareBtn.textContent='…';
    shareCard('MEMORY MELTDOWN', 'LVL '+lvl, 'how far can you go?', `I hit level ${lvl} on Memory Meltdown 🧠 — beat me 👉 ${_gameURL('target='+lvl)}`)
      .then(()=>{ shareBtn.textContent='Shared 📸'; }); };
})();
</script>
</body>
</html>
